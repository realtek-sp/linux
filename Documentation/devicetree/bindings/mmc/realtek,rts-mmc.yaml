# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/realtek,rts-mmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek MMC Controller Device Tree Bindings for RTS493xA Series

allOf:
  - $ref: "mmc-controller.yaml"

properties:
  compatible:
    contains:
      const: realtek,rts493xa-sdhc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 3
    maxItems: 3
    items:
      - description: CRC Clock
      - description: PUSH Clock
      - description: SAMPLE Clock

  clock-names:
    minItems: 3
    maxItems: 3
    items:
      - const: sd_crc_ck
      - const: sd_sample_ck
      - const: sd_push_ck

  resets:
    $ref: '/schemas/types.yaml#/definitions/phandle-array'

  reset-names:
    items:
    - const: reset-sd-device
    - const: sdio-sysmem-up

  pinctrl-names:
    items:
      - const: default
      - const: pullup
      - const: pulldown

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - pinctrl-names

additionalProperties: true

examples:
  - |
    sdhc0: mmc_sdhc@18300000 {
      compatible = "realtek,rts493xa-sdhc";
      reg = <0x18300000 0x100000>;
      interrupts = <0x0 0x14 0x4>;
      clock-names = "sd_crc_ck", "sd_sample_ck", "sd_push_ck";
      clocks = <&clks 0x64>, <&clks 0x66>, <&clks 0x68>;
      resets = <&reset 0x5>, <&sysmem 0x8>;
      reset-names = "reset-sd-device", "sdio-sysmem-up";
      pinctrl-names = "default", "pullup", "pulldown";
			pinctrl-0 = <&sdhc0_default_mode>;
			pinctrl-1 = <&sdhc0_pullup_mode>;
			pinctrl-2 = <&sdhc0_pulldown_mode>;
      disable-wp;
      cd-inverted;
      bus-width = <4>;
      cap-sd-highspeed;
      cap-mmc-highspeed;
    };

...
