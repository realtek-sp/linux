%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/realtek,rts-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTC Device Tree Bindings for RTS493xA Series

allOf:
  - $ref: "rtc.yaml#"

properties:
  compatible:
    contains:
      const: realtek,rts493xa-rtc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: true

examples:
  - |
    rtc: rtc@18850000 {
        compatible = "realtek,rts493xa-rtc";
        reg = <0x18850000 0x1000>;
        interrupts = <0x0 0x2a 0x4>;
    };

...
