%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/realtek,rts-thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek Thermal Device Tree Bindings for RTS493xA Series

properties:
  compatible:
    contains:
      const: realtek,rts493xa-thermal

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  "#thermal-sensor-cells":
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - "#thermal-sensor-cells"

additionalProperties: true

examples:
  - |
    thermal: thermal@188a0200 {
      compatible = "realtek,rts493xa-thermal";
      reg = <0x188a0200 0x100>;
      interrupts = <0x0 0x29 0x4>;
      #thermal-sensor-cells = <0>;
    };

...
