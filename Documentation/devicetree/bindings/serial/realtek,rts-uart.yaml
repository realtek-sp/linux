%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/realtek,rts-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek UART Device Tree Bindings for RTS493xA Series

allOf:
  - $ref: /schemas/serial.yaml#

properties:
  compatible:
    contains:
      const: realtek,rts493xa-uart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reg-shift:
    default: 2

  reg-io-width:
    default: 4

  current-speed:
    default: 57600

  clocks:
    maxItems: 1

  clock-frequency:
    default: 24000000

  pinctrl-names:
    items:
      - const: default

required:
  - compatible
  - reg
  - interrupts
  - reg-shift
  - reg-io-width
  - current-speed
  - clocks
  - clock-frequency
  - pinctrl-names

additionalProperties: true

examples:
  - |
    uart0: serial@18810000 {
      compatible = "realtek,rts493xa-uart";
      reg = <0x18810000 0x100>;
      interrupts = <0x0 0x25 0x4>;
      reg-shift = <2>;
      reg-io-width = <4>;
      current-speed = <57600>;
      clocks = <&clks RLX_CLK_UART_CK>;
      clock-frequency = <24000000>;
      pinctrl-names = "default";
      pinctrl-0 = <&uart0_default_mode>;
    };

...
