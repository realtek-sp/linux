%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/realtek,rts-ohci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek USB OHCI Controller Device Tree Bindings for RTS493xA Series

allOf:
  - $ref: "usb-hcd.yaml"

properties:
  compatible:
    contains:
      const: realtek,rts493xa-ohci

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  resets:
    $ref: '/schemas/types.yaml#/definitions/phandle-array'

  reset-names:
    const: reset-usb-host

required:
  - compatible
  - reg
  - interrupts
  - reset-names

additionalProperties: false

examples:
  - |
    usb_ohci: usb_ohci@18180000 {
      compatible = "realtek,rts493xa-ohci";
      reg = <0x18180000 0x1000>;
      interrupts = <0x0 0x11 0x4>;
      resets = <&reset 0xb>;
      reset-names = "reset-usb-host";
    };

...
