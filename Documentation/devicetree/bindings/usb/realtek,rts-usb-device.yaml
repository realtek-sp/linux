%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/realtek,rts-usb-device.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek USB Dev Device Tree Bindings for RTS493xA Series

allOf:
  - $ref: "usb-hcd.yaml"

properties:
  compatible:
    contains:
      const: realtek,rts493xa-usb-device

  reg:
    minItems: 1
    maxItems: 2

  interrupts:
    maxItems: 2

  resets:
    $ref: '/schemas/types.yaml#/definitions/phandle-array'

  reset-names:
    items:
    - const: reset-usb-device
    - const: u2dev-sysmem-up

required:
  - compatible
  - reg
  - interrupts
  - resets
  - reset-names

additionalProperties: false

examples:
  - |
    usb_device: usb_device@18290000 {
      compatible = "realtek,rts493xa-usb-device";
      reg = <0x18290000 0x900>, <0x18280000 0x2000>;
      interrupts =	<0x0 0x12 0x4>, <0x0 0x13 0x4>;
      resets = <&reset 0xa>, <&sysmem 0x7>;
      reset-names = "reset-usb-device", "u2dev-sysmem-up";
    };

...
