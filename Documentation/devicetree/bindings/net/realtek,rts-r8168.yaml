%YAML 1.2
---
$id: "http://devicetree.org/schemas/net/realtek,rts-r8168.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Realtek RTL8168 Ethernet Controller Device Tree Bindings for RTS493xA Series

allOf:
  - $ref: /schemas/net/ethernet-controller.yaml#

properties:
  compatible:
    enum:
      - realtek,rts493xa-r8168

  reg:
    minItems: 2
    maxItems: 2
    description: |
      Base addresses and sizes of the Ethernet controller registers.

  interrupt-parent:
    description: |
      Phandle to the interrupt controller.

  interrupts:
    maxItems: 1
    description: |
      Interrupt specifier for the Ethernet controller.

  resets:
    minItems: 3
    maxItems: 3
    description: |
      Phandles to the reset controllers.

  reset-names:
    items:
      - const: eth-reset
      - const: fephy-reset
      - const: eth-mem-up
    description: |
      Names of the reset lines used by the Ethernet controller.

  status:
    enum: [ "okay", "disabled" ]
    description: |
      Operational status of the Ethernet controller.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-parent
  - resets
  - reset-names

additionalProperties: true

examples:
  - |
    eth0: rtl8168@18400000 {
      compatible = "realtek,rts493xa-r8168";
      reg = <0x18400000 0x1000>, <0x18862000 0x1000>;
      interrupt-parent = <&gic>;
      interrupts = <GIC_SPI BSP_IRQ_ETH IRQ_TYPE_LEVEL_HIGH>;
      resets = <&reset FORCE_RESET_ETHERNET>,
               <&reset FORCE_RESET_FEPHY>,
               <&sysmem SYS_MEM_SD_ETH>;
      reset-names = "eth-reset", "fephy-reset", "eth-mem-up";
      status = "disabled";
    };

...