%YAML 1.2
---
$id: http://devicetree.org/schemas/pwm/realtek,rts-pwm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek PWM Device Tree Bindings for RTS493xA Series

properties:
  compatible:
    contains:
      const: realtek,rts493xa-pwm

  reg:
    maxItems: 1

  pinctrl-names:
    enum:
    - default

required:
  - compatible
  - reg
  - pinctrl-names

additionalProperties: true

examples:
  - |
    pwm: pwm@18820000 {
      compatible = "realtek,rts493xa-pwm";
      reg = <0x18820000 0x10000>;
      pinctrl-names = "default";
    };

...
