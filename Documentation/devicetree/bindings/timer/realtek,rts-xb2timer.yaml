%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/realtek,rts-xb2timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek XB2 Timer Device Tree Bindings for RTS493xA Series

properties:
  compatible:
    contains:
      const: realtek,rts493xa-timer

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: true

examples:
  - |
    rts_timer0: rts_timer@18890000 {
      compatible = "realtek,rts493xa-timer";
      reg = <0x18890000 0x100>;
      interrupts = <0x0 0x0 0x4>;
    };

...
