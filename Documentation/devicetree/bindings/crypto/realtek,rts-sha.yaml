# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/realtek,rts-sha.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek SHA Device Tree Bindings For rts493xa Series

maintainers:
  - todd_jin <todd_jin@realsil.com.cn>

properties:
  compatible:
    enum:
      - realtek,rts493xa-sha

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: SHA Clock

  clock-names:
    items:
      - const: sha_ck

  resets:
    maxItems: 1

  reset-names:
    items:
      - const: rst

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names

additionalProperties: false

examples:
  - |
    sha: sha@19200000 {
      compatible = "realtek,rts493xa-sha";
      reg = <0x19200000 0x10000>;
      interrupts = <0x0 0x19 0x4>;
      clocks = <&clks 0x4d>;
      clock-names = "sha_ck";
      resets = <&reset 0x12>;
      reset-names = "rst";
    };

...
