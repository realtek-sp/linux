# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/realtek,rts-rsa.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RSA Device Tree Bindings For rts493xa Series

maintainers:
  - todd_jin <todd_jin@realsil.com.cn>

properties:
  compatible:
    enum:
      - realtek,rts493xa-rsa

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: RSA Clock

  clock-names:
    items:
      - const: rsa_ck

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: rst
      - const: sd

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names

additionalProperties: false

examples:
  - |
    rsa: rsa@18f00000 {
      compatible = "realtek,rts493xa-rsa";
      reg = <0x18f00000 0x10000>;
      interrupts = <0x0 0x18 0x4>;
      clocks = <&clks 0x4c>;
      clock-names = "rsa_ck";
      resets = <&reset 0x11>, <&sysmem 0xb>;
      reset-names = "rst", "sd";
    };

...
