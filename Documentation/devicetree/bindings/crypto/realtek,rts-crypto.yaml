%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/realtek,rts-crypto.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek Crypto Security System Device Tree Bindings for RTS493xA Series

properties:
  compatible:
    enum:
      - realtek,rts493xa-crypto

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Crypto Clock

  clock-names:
    items:
      - const: cipher_ck

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: rst
      - const: sd

  aes:
    items:
      - const: ecb
      - const: cbc
      - const: ctr

  aead:
    items:
      - const: gcm(aes)
      - const: ccm(aes)

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - aes
  - aead

additionalProperties: false

examples:
  - |
    crypto: crypto@18600000 {
      compatible = "realtek,rts493xa-crypto";
      reg = <0x18600000 0x10000>;
      interrupts = <0x0 0x17 0x4>;
      clocks = <&clks 0x41>;
      clock-names = "cipher_ck";
      resets = <&reset 0x4>, <&sysmem 0x4>;
      reset-names = "rst", "sd";
      aes = "ecb", "cbc", "ctr";
      aead = "gcm(aes)", "ccm(aes)";
    };

...
