# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/realtek,rts-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek DMA Controller Device Tree Bindings For rts493xa Series

maintainers:
  - todd_jin <todd_jin@realsil.com.cn>

allOf:
  - $ref: "dma-controller.yaml#"

properties:
  compatible:
    contains:
      const: realtek,rts493xa-dmac

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: DMAC Clock

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: true

examples:
  - |
    dmahost: dma-controller@18020000 {
      compatible = "realtek,rts493xa-dmac";
      reg = <0x18020000 0x100>;
      interrupts = <0x0 0x16 0x4>;
      clocks = <&clks 0x1b>;
      #dma-cells = <3>;
      dma-channels = <2>;
      dma-vchannels = <4>;
      dma-masters = <1>;
      chan_priority = <1>;
      block_size = <0xfff>;
      data-width = <4 0 0 0>;
    };

...
