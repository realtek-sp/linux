%YAML 1.2
---
$id: "http://devicetree.org/schemas/i2c/realtek,rts-i2c.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Realtek I2C Controller Device Tree Bindings for RTS493xA Series

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    enum:
      - realtek,rts493xa-i2c

  reg:
    maxItems: 1
    description: |
      Base address and size of the I2C controller registers.

  interrupts:
    maxItems: 1
    description: |
      Interrupt specifier for the I2C controller.

  interrupt-parent:
    description: |
      Phandle to the interrupt controller.

  clocks:
    maxItems: 1
    description: |
      Phandle to the clock used by the I2C controller.

  clock-names:
    items:
      - const: i2c_ck
    description: |
      Name of the clock used by the I2C controller.

  resets:
    maxItems: 1
    description: |
      Phandle to the reset controller.

  reset-names:
    items:
      - const: reset-i2c
    description: |
      Name of the reset line used by the I2C controller.

  pinctrl-names:
    items:
      - const: default
    description: |
      Names of the pin control states.

  pinctrl-0:
    description: |
      Phandle to the pin control state.

  "#address-cells":
    const: 1
    description: |
      Number of address cells for child nodes.

  "#size-cells":
    const: 0
    description: |
      Number of size cells for child nodes.

  status:
    enum: [ "okay", "disabled" ]
    description: |
      Operational status of the I2C controller.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - pinctrl-names
  - pinctrl-0
  - "#address-cells"
  - "#size-cells"

additionalProperties: true

examples:
  - |
    i2c0: i2c@18880000 {
      compatible = "realtek,rts493xa-i2c";
      reg = <18880000 0x1000>;
      interrupts = <GIC_SPI BSP_IRQ_I2C0 IRQ_TYPE_LEVEL_HIGH>;
      interrupt-parent = <&gic>;
      clocks = <&clks RLX_CLK_I2C0_CK>;
      clock-names = "i2c_ck";
      resets = <&reset FORCE_RESET_I2C0>;
      reset-names = "reset-i2c";
      pinctrl-names = "default";
      pinctrl-0 = <&i2c0_default_mode>;
      #address-cells = <1>;
      #size-cells = <0>;
      status = "disabled";
    };

...