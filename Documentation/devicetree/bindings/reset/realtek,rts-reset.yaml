%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/realtek,rts-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek Reset Controller Device Tree Bindings for RTS493xA Series

properties:
  compatible:
    contains:
      const: realtek,rts493xa-reset

  reg:
    maxItems: 1

  "#reset-cells":
    const: 1

required:
  - compatible
  - reg
  - "#reset-cells"

additionalProperties: true

examples:
  - |
    reset: reset-controller@188d8000 {
      compatible = "realtek,rts493xa-reset";
      reg = <0x188d8000 0x1000>;
      #reset-cells = <1>;
    };

...
