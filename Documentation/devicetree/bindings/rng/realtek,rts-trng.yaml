%YAML 1.2
---
$id: http://devicetree.org/schemas/rng/realtek,rts-trng.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek TRNG Device Tree Bindings for RTS493xA Series

properties:
  compatible:
    enum:
      - realtek,rts493xa-trng

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: TRNG Clock

  clock-names:
    items:
      - const: trng_ck

  resets:
    maxItems: 1

  reset-names:
    items:
      - const: rst

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names

additionalProperties: false

examples:
  - |
    trng: trng@188a0100 {
      compatible = "realtek,rts493xa-trng";
      reg = <0x188a0100 0x100>;
      interrupts = <0x0 0x1a 0x4>;
      clocks = <&clks 0x56>;
      clock-names = "trng_ck";
      resets = <&reset 0x13>;
      reset-names = "rst";
    };

...
